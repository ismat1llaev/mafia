# Не даёт сервису на Render заснуть.
#
# Бесплатный план Render усыпляет сервис после 15 минут без запросов,
# и следующий игрок ждёт около минуты, пока тот поднимется. Обычный
# запрос раз в 10 минут этого не допускает.
#
# Будильник работает с 02:00 до 21:59 UTC — это с 6 утра до 2 ночи по
# Самаре. Ночью игра спит: незачем жечь бесплатные часы, когда никто
# не играет. Выходит около 600 часов в месяц из 750 доступных, запас есть.

name: keep-alive

on:
  schedule:
    - cron: '*/10 2-21 * * *'
  # Кнопка "Run workflow" на вкладке Actions — чтобы разбудить вручную
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Разбудить сервис
        run: |
          # -m 90: спящий сервис поднимается до минуты, обычного таймаута мало
          code=$(curl -sS -m 90 -o /tmp/body -w '%{http_code}' \
            https://mafia-s1nl.onrender.com/health) || true
          echo "ответ: $code"
          cat /tmp/body || true
          echo
          if [ "$code" != "200" ]; then
            echo "::warning::сервис ответил $code вместо 200"
          fi
